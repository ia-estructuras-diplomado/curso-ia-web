name: Labs CI

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/labs-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/labs-ci.yml"
  workflow_dispatch:
  schedule:
    # Lunes 09:00 UTC — detectar roturas por dependencias upstream
    - cron: "0 9 * * 1"

concurrency:
  group: labs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-notebooks:
    name: Linux · setup.sh · notebooks de referencia
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('labs/requirements.txt', 'labs/setup.sh', 'labs/_install_torch_cpu.sh') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Bootstrap labs environment
        run: bash labs/setup.sh

      - name: Ejecutar notebooks de referencia (Labs 0-4)
        run: bash labs/_verificar_notebooks.sh

  windows-setup:
    name: Windows · setup.ps1
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap labs environment (PowerShell nativo)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File labs\setup.ps1

      - name: Importar dependencias del curso
        shell: pwsh
        run: labs\.venv\Scripts\python.exe -c "import pandas, sklearn, xgboost, shap, lime, torch, torchvision; print('OK')"
