# Información de contacto
contact:
  email: "info@ia-estructuras.edu"
  website: "https://ia-estructuras-diplomado.github.io"
  repository: "https://github.com/ia-estructuras-diplomado/curso-ia-web"

# Sistema de calificación
grading:
  formula: "NF = 0.30*T1 + 0.30*T2 + 0.40*T3"
  breakdown:
    T1: 
      name: "Trabajo Grupal 1"
      percentage: 30
      date: "2026-06-09"
    T2: 
      name: "Trabajo Grupal 2"
      percentage: 30
      date: "2026-06-18"
    T3: 
      name: "Trabajo Grupal 3"
      percentage: 40
      date: "2026-06-23"

# Prerrequisitos y descripción
prerequisites: "Conocimientos básicos en programación y conceptos de ingeniería"
description: |
  Este diplomado ofrece una introducción integral a la Inteligencia Artificial aplicada 
  a la Ingeniería Civil. Cubriremos desde conceptos fundamentales de Machine Learning 
  hasta aplicaciones prácticas en monitoreo estructural y modelado digital.

# Objetivos de aprendizaje
learning_outcomes:
  - "Comprender conceptos fundamentales de IA, ML y Deep Learning"
  - "Aplicar técnicas de ML en problemas reales de ingeniería civil"
  - "Desarrollar habilidades en análisis de datos y Big Data"
  - "Diseñar y entrenar modelos predictivos para casos de uso estructurales"
  - "Comprender el futuro de Digital Twins y Smart Cities"

# Mapeo docs/labs ↔ labs/ (sincronizado desde curso-ia-dev)
# La numeración sigue curso-ia-dev, no el syllabus web (subject to change).
labs:
  web_repo: "ia-estructuras-diplomado/curso-ia-web"
  dev_source_repo: "ia-estructuras-diplomado/curso-ia-dev"
  mapping:
    - web_id: lab0
      doc: docs/labs/lab0.md
      dev_path: labs/lab0
      notebook: fundamentos_python_ia.ipynb
      title: "Fundamentos de Python para IA"
      status: disponible
    - web_id: lab1
      doc: docs/labs/lab1.md
      dev_path: labs/lab1
      notebook: pca_monitoreo_estructural.ipynb
      title: "PCA, Clustering y Monitoreo Estructural (SHM)"
      status: disponible
    - web_id: lab2
      doc: docs/labs/lab2.md
      dev_path: labs/lab2
      notebook: resistencia_compresion.ipynb
      title: "Predicción Resistencia a la Compresión (UCI)"
      status: disponible
    - web_id: lab3
      doc: docs/labs/lab3.md
      dev_path: labs/lab3
      notebook: xai_estructuras.ipynb
      title: "Inteligencia Artificial Explicable (xAI)"
      status: disponible
    - web_id: lab4
      doc: docs/labs/lab4.md
      dev_path: labs/lab4
      notebook: part_1/cnn_grietas_estructuras.ipynb, part_2/rnn_sensores_estructuras.ipynb
      title: "Redes Neuronales, CNN y LSTM"
      status: disponible
    - web_id: lab5
      doc: docs/labs/lab5.md
      dev_path: labs/lab5
      notebook: null  # guía Claude Code (README.md)
      title: "Tu primer agente: Claude Code + MCP de normas (RAG)"
      status: disponible
    - web_id: lab6
      doc: docs/labs/lab6.md
      dev_path: labs/lab6
      notebook: null  # guía Claude Code (README.md); requiere Windows + ETABS 21+
      title: "Agentes con ETABS: de un agente a un orquestador"
      status: disponible
