# Configuración del servidor MCP "normas" (knowledge-rag) — Lab 5 y Lab 6.
# Claude Code lo lanza vía .mcp.json. labs/mcp/sitecustomize.py (en PYTHONPATH)
# manda print() a stderr y convierte KNOWLEDGE_RAG_DIR en ruta absoluta antes
# de que el servidor la lea. Rutas relativas a esta carpeta.

paths:
  documents_dir: "../pdfs"            # indexa directamente los PDFs del lab
  data_dir: "./data"                  # índice vectorial (ChromaDB) — gitignored
  models_cache_dir: "./models_cache"  # modelo de embeddings (~240 MB) — gitignored

documents:
  supported_formats: [.pdf, .md, .txt]
  exclude_patterns: []
  chunking:
    chunk_size: 1000
    chunk_overlap: 200

models:
  embedding:
    # El modelo por defecto de knowledge-rag (bge-small-en) es solo inglés.
    # Las normas están en español → modelo multilingüe (soportado por FastEmbed).
    model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    dimensions: 384
    query_prefix: ""
    passage_prefix: ""
  reranker:
    # El reranker por defecto (ms-marco) está entrenado en inglés; desactivado.
    enabled: false

search:
  default_results: 5
  max_results: 20
  collection_name: "normas_peru"

category_mappings: {}
keyword_routes: {}

# Sinónimos para la parte léxica (BM25). No cambian los embeddings: no hace
# falta borrar rag/data/. Las claves se comparan con la consulta en minúsculas.
query_expansions:
  "carga viva": ["sobrecarga", "carga viva repartida"]
  viviendas: ["vivienda"]
  oficinas: ["oficina"]
  "factor de zona": ["factor Z", "zonificación"]
  "mecánica de suelos": ["EMS", "estudio de mecánica de suelos"]
  "estudio de mecánica de suelos": ["EMS"]
